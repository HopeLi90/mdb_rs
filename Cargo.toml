[package]
name = "pgdb-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["GIS Developer"]
description = "ESRI Personal Geodatabase (*.mdb) 解析与管理库：要素类/要素数据集遍历、属性与几何更新"
license = "MIT OR Apache-2.0"
repository = ""
keywords = ["gis", "mdb", "personal-geodatabase", "esri", "access"]
categories = ["science::geo", "parser-implementations"]

[lib]
name = "pgdb"
path = "src/lib.rs"

[[bin]]
name = "pgdb-cli"
path = "src/bin/pgdb-cli.rs"

[features]
default = []

[dependencies]
thiserror = "2"
byteorder = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
# ODBC 后端：经由驱动访问真实 *.mdb，支持读写
# （Windows: Microsoft Access Driver / ACE；Linux: MDBTools 仅只读）。
odbc-api = { version = "8", default-features = false, features = ["narrow", "odbc_version_3_80"] }
# jetdb 只读后端：纯 Rust 解析 *.mdb / *.accdb，无需任何驱动，跨平台。
jetdb = "0.3.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
